<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khmer Chief — Daily Cambodian Recipes</title>
<meta name="description" content="Browse and search 1000+ Cambodian (Khmer) dishes with step-by-step cooking instructions." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#9e2b25; --red-dark:#7a201c; --gold:#d4a437; --gold-soft:#f0d79a;
    --cream:#fbf7f0; --card:#ffffff; --ink:#2a2320; --muted:#857b72;
    --line:#ece4d8; --green:#4f7d52; --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
    --khmer:'Noto Sans Khmer','Khmer OS','Khmer OS System',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .km{font-family:var(--khmer)}
  a{color:inherit}

  /* ---------- header ---------- */
  header.top{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff; padding:22px 18px 16px;
  }
  .top-inner{max-width:1180px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{font-size:30px;line-height:1}
  .brand h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand .tag{margin:2px 0 0;font-size:13px;opacity:.85}
  .searchbar{position:relative;margin-top:16px;max-width:620px}
  .searchbar input{
    width:100%;padding:13px 44px 13px 44px;border:none;border-radius:12px;
    font-size:16px;background:#fff;color:var(--ink);box-shadow:var(--shadow);outline:none;
  }
  .searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6}
  .searchbar .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    border:none;background:#eee;border-radius:50%;width:26px;height:26px;cursor:pointer;font-size:15px;color:#555;display:none}

  /* ---------- layout ---------- */
  main{max-width:1180px;margin:0 auto;padding:18px}

  /* ---------- dish of the day ---------- */
  .daily{
    display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:22px;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .daily:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.10)}
  .daily .emoji{font-size:54px;width:96px;height:96px;flex:0 0 96px;border-radius:14px;
    display:grid;place-items:center;background:var(--gold-soft)}
  .daily .label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--red);text-transform:uppercase}
  .daily h2{margin:4px 0 2px;font-size:20px}
  .daily .rom{color:var(--muted);font-size:14px}
  .daily .desc{margin-top:6px;font-size:14px;color:#5e564f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- filters ---------- */
  .filters{margin-bottom:14px}
  .frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
  .frow .flabel{font-size:12px;font-weight:600;color:var(--muted);width:74px;flex:0 0 74px;text-transform:uppercase;letter-spacing:.5px}
  .chip{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;
    cursor:pointer;white-space:nowrap;transition:all .1s ease;user-select:none;
  }
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--red);border-color:var(--red);color:#fff}
  .chip.on.green{background:var(--green);border-color:var(--green)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;flex-wrap:wrap;gap:8px}
  .count{font-size:14px;color:var(--muted)}
  .reset{border:none;background:none;color:var(--red);font-size:13px;cursor:pointer;font-weight:600}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease, box-shadow .12s ease;display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
  .card .head{height:92px;display:grid;place-items:center;font-size:42px;position:relative}
  .card .cat{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.32);color:#fff;font-size:11px;
    padding:3px 8px;border-radius:999px;text-transform:capitalize;backdrop-filter:blur(2px)}
  .card .body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
  .card h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
  .card .rom{color:var(--muted);font-size:13px;margin-top:1px}
  .card .km{color:#9a9089;font-size:13px;margin-top:1px}
  .card .meta{margin-top:auto;padding-top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#6c635b;align-items:center}
  .card .meta .dot{opacity:.4}
  .diet{display:inline-block;background:#eef5ee;color:var(--green);font-size:11px;padding:2px 7px;border-radius:999px;margin-right:4px}
  .loadmore{display:block;margin:26px auto;padding:11px 26px;border:1px solid var(--red);background:#fff;color:var(--red);
    border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
  .loadmore:hover{background:var(--red);color:#fff}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:16px}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,22,18,.55);display:none;z-index:50;padding:20px;overflow:auto}
  .overlay.open{display:block}
  .modal{max-width:760px;margin:30px auto;background:var(--cream);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modal .mhead{padding:24px 26px;color:#fff;position:relative;background:linear-gradient(135deg,var(--red),var(--red-dark))}
  .modal .mhead .big{font-size:46px}
  .modal .mhead h2{margin:6px 0 2px;font-size:25px}
  .modal .mhead .rom{opacity:.9;font-size:15px}
  .modal .mhead .km{opacity:.85;font-size:15px}
  .modal .mhead .desc{margin-top:10px;font-size:14px;opacity:.95;max-width:62ch}
  .mclose{position:absolute;top:16px;right:16px;width:34px;height:34px;border:none;border-radius:50%;
    background:rgba(255,255,255,.25);color:#fff;font-size:20px;cursor:pointer}
  .mbody{padding:22px 26px 30px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;min-width:78px}
  .stat b{display:block;font-size:15px;margin-top:1px}
  .sec-title{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin:24px 0 10px}
  .kroeung-note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:6px}
  .ing-group{margin-bottom:14px}
  .ing-group .gname{font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize;margin-bottom:5px}
  ul.ings{list-style:none;margin:0;padding:0}
  ul.ings li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  ul.ings li .qty{flex:0 0 92px;font-weight:600;color:var(--ink)}
  ul.ings li .nm{flex:1}
  ul.ings li .nt{color:var(--muted);font-size:13px}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:step}
  ol.steps li{position:relative;padding:0 0 18px 46px;counter-increment:step}
  ol.steps li:before{content:counter(step);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;
    background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  ol.steps li .txt{font-size:15px}
  ol.steps li .tip{margin-top:6px;background:#fff;border-left:3px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:13px;color:#6c635b}
  ol.steps li .tip b{color:var(--gold)}
  .spice{color:var(--red);letter-spacing:1px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 16px 50px}

  @media(max-width:560px){
    .daily{flex-direction:column;align-items:flex-start}
    .frow .flabel{width:100%;flex-basis:100%;margin-bottom:2px}
    ul.ings li{flex-wrap:wrap}
    ul.ings li .qty{flex-basis:auto}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="logo">🍳</span>
      <div>
        <h1>Khmer Chief <span class="km" style="opacity:.85;font-weight:600">មុខម្ហូបខ្មែរ</span></h1>
        <p class="tag">Your daily Cambodian recipe — <span id="totalCount">0</span> dishes to cook</p>
      </div>
    </div>
    <div class="searchbar">
      <span class="ic">🔍</span>
      <input id="search" type="search" placeholder="Search dishes, ingredients… (e.g. amok, lemongrass, beef)" autocomplete="off" />
      <button class="clear" id="clearBtn" aria-label="Clear">✕</button>
    </div>
  </div>
</header>

<main>
  <div id="daily" class="daily" style="display:none"></div>

  <div class="filters" id="filters"></div>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <button class="reset" id="reset">Reset filters</button>
  </div>

  <div class="grid" id="grid"></div>
  <div id="emptyMsg"></div>
  <button class="loadmore" id="loadmore" style="display:none">Load more</button>
</main>

<footer>
  Cooked up with ❤️ — Khmer Chief recipe catalog · <span id="footCount">0</span> dishes
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="khmer_data.js"></script>
<script>
(function(){
  "use strict";
  const DATA = (window.KHMER_MENU && window.KHMER_MENU.recipes) || [];
  const PAGE = 48;

  // ---------- visual maps ----------
  const CAT = {
    "stir-fry":{e:"🥘",c:"#c0612e"}, "soup":{e:"🍲",c:"#b8862b"}, "curry":{e:"🍛",c:"#c2761f"},
    "grilled":{e:"🍢",c:"#9e5b2c"}, "fried":{e:"🍤",c:"#c98a2c"}, "braised":{e:"🍖",c:"#8c4a2f"},
    "steamed":{e:"🥟",c:"#7a8a5a"}, "salad":{e:"🥗",c:"#5b8a4f"}, "noodles":{e:"🍜",c:"#b76b30"},
    "rice":{e:"🍚",c:"#9a8f6b"}, "dip":{e:"🫕",c:"#a85a3a"}, "dessert":{e:"🍮",c:"#cf8aa0"},
    "drink":{e:"🥤",c:"#5a93a8"}, "snack":{e:"🥟",c:"#b0843a"}
  };
  const catView = c => CAT[c] || {e:"🍽️",c:"#9a8f6b"};

  const PROTEINS = [
    ["chicken","🐔 Chicken"],["pork","🐷 Pork"],["beef","🐄 Beef"],["duck","🦆 Duck"],
    ["fish","🐟 Fish"],["shrimp","🦐 Shrimp"],["squid","🦑 Squid"],["crab","🦀 Crab"],
    ["tofu","🧈 Tofu"],["egg","🥚 Egg"],["vegetable","🥬 Veg"]
  ];
  const PROTEIN_KEYS = new Set(PROTEINS.map(p=>p[0]));
  const DIETS = [["vegetarian","Vegetarian"],["vegan","Vegan"],["pescatarian","Pescatarian"],["gluten-free","Gluten-free"]];
  const SPICE = ["🌶️","🌶️🌶️","🌶️🌶️🌶️","🌶️🌶️🌶️🌶️","🌶️🌶️🌶️🌶️🌶️"];
  const spiceText = n => n<=0 ? "No heat" : (SPICE[Math.min(n,5)-1] + " " + (n<=1?"Mild":n<=2?"Medium":"Hot"));

  // ---------- search index ----------
  function norm(s){return (s||"").toLowerCase();}
  function tok(s){return norm(s).split(/[^a-z0-9ក-៿]+/).filter(Boolean);}
  DATA.forEach(r=>{
    const mains = (r.ingredients||[]).filter(i=>i.group==="main"||i.group==="kroeung").map(i=>i.item);
    r._hay = norm([r.name.en,r.name.romanized,r.name.km,(r.tags||[]).join(" "),r.category,r.subcategory,mains.join(" ")].join(" "));
    r._name = norm([r.name.en,r.name.romanized,r.name.km].join(" "));
    r._tok = Array.from(new Set(tok(r._hay)));
    r._prot = (r.tags||[]).filter(t=>PROTEIN_KEYS.has(t));
  });

  // capped Levenshtein for typo tolerance
  function lev(a,b,max){
    const m=a.length,n=b.length;
    if(Math.abs(m-n)>max) return max+1;
    let prev=Array.from({length:n+1},(_,i)=>i);
    for(let i=1;i<=m;i++){
      let cur=[i]; let best=i;
      for(let j=1;j<=n;j++){
        const cost=a[i-1]===b[j-1]?0:1;
        const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
        cur[j]=v; if(v<best)best=v;
      }
      if(best>max) return max+1;
      prev=cur;
    }
    return prev[n];
  }
  function isSubseq(q,h){let i=0;for(let j=0;j<h.length&&i<q.length;j++){if(q[i]===h[j])i++;}return i===q.length;}

  function scoreToken(qt,r){
    for(const t of r._tok){
      if(t===qt) return 100;
      if(t.startsWith(qt)) return 88;
    }
    if(r._hay.indexOf(qt)>=0) return 72;
    const max = qt.length<=5?1:2;
    let best=0;
    for(const t of r._tok){
      if(Math.abs(t.length-qt.length)>max) continue;
      const d=lev(qt,t,max);
      if(d<=max){const sc=70-d*18;if(sc>best)best=sc;}
    }
    if(best===0 && isSubseq(qt,r._hay)) best=46;
    return best;
  }
  function score(query,r){
    const qts=tok(query); if(!qts.length) return 0;
    let total=0, matched=0;
    for(const qt of qts){const s=scoreToken(qt,r);if(s>0)matched++;total+=s;}
    if(matched<qts.length) return 0;            // every term must match
    let bonus=0;
    if(r._name.indexOf(norm(query))>=0) bonus+=45;
    if((r.tags||[]).includes("signature")) bonus+=6;
    return bonus + total/qts.length;
  }

  // ---------- state ----------
  const state = {q:"", cat:new Set(), prot:new Set(), diet:new Set(), spice:null, shown:PAGE};
  let results = [];

  // ---------- filters UI ----------
  function chip(label,active,green){
    const b=document.createElement("button");
    b.className="chip"+(active?" on":"")+(green?" green":"");
    b.textContent=label; return b;
  }
  function buildFilters(){
    const wrap=document.getElementById("filters"); wrap.innerHTML="";
    const cats=Array.from(new Set(DATA.map(r=>r.category))).sort();
    const mk=(labelText,items,facet,green)=>{
      const row=document.createElement("div"); row.className="frow";
      const lab=document.createElement("span"); lab.className="flabel"; lab.textContent=labelText; row.appendChild(lab);
      items.forEach(([key,label])=>{
        const c=chip(label,state[facet].has(key),green);
        c.onclick=()=>{ state[facet].has(key)?state[facet].delete(key):state[facet].add(key); state.shown=PAGE; render(); buildFilters(); };
        row.appendChild(c);
      });
      wrap.appendChild(row);
    };
    mk("Category", cats.map(c=>[c, catView(c).e+" "+c]), "cat", false);
    mk("Protein", PROTEINS.filter(p=>DATA.some(r=>r._prot.includes(p[0]))), "prot", false);
    mk("Diet", DIETS.filter(d=>DATA.some(r=>(r.dietary||[]).includes(d[0]))), "diet", true);

    // spice (single select)
    const row=document.createElement("div"); row.className="frow";
    const lab=document.createElement("span"); lab.className="flabel"; lab.textContent="Spice"; row.appendChild(lab);
    [["0","No heat"],["1","🌶️ Mild"],["2","🌶️🌶️ Medium"],["3","🌶️🌶️🌶️ Hot"]].forEach(([v,l])=>{
      const c=chip(l,state.spice===v,false);
      c.onclick=()=>{ state.spice = state.spice===v?null:v; state.shown=PAGE; render(); buildFilters(); };
      row.appendChild(c);
    });
    wrap.appendChild(row);
  }

  // ---------- filtering ----------
  function passFilters(r){
    if(state.cat.size && !state.cat.has(r.category)) return false;
    if(state.prot.size && !r._prot.some(p=>state.prot.has(p))) return false;
    if(state.diet.size && !(r.dietary||[]).some(d=>state.diet.has(d))) return false;
    if(state.spice!==null && String(r.spiceLevel)!==state.spice) return false;
    return true;
  }
  function compute(){
    let list = DATA.filter(passFilters);
    if(state.q.trim()){
      list = list.map(r=>({r,s:score(state.q,r)})).filter(x=>x.s>0)
                 .sort((a,b)=>b.s-a.s).map(x=>x.r);
    }else{
      list.sort((a,b)=>{
        const as=(a.tags||[]).includes("signature")?0:1, bs=(b.tags||[]).includes("signature")?0:1;
        if(as!==bs) return as-bs;
        return a.name.en.localeCompare(b.name.en);
      });
    }
    results=list;
  }

  // ---------- card render ----------
  function metaLine(r){
    const t=r.time||{};
    const bits=[];
    bits.push('<span style="text-transform:capitalize">'+r.difficulty+'</span>');
    if(t.totalMinutes) bits.push('⏱ '+t.totalMinutes+' min');
    if(r.spiceLevel>0) bits.push('<span class="spice">'+SPICE[Math.min(r.spiceLevel,5)-1]+'</span>');
    return bits.join('<span class="dot">·</span>');
  }
  function cardEl(r){
    const v=catView(r.category);
    const el=document.createElement("div"); el.className="card";
    el.innerHTML=
      '<div class="head" style="background:'+v.c+'22">'+
        '<span>'+v.e+'</span><span class="cat">'+r.category+'</span></div>'+
      '<div class="body">'+
        '<h3>'+esc(r.name.en)+'</h3>'+
        '<div class="rom">'+esc(r.name.romanized)+'</div>'+
        '<div class="km">'+esc(r.name.km)+'</div>'+
        '<div class="meta">'+metaLine(r)+'</div>'+
      '</div>';
    el.onclick=()=>openModal(r);
    return el;
  }

  function render(){
    compute();
    const grid=document.getElementById("grid");
    const empty=document.getElementById("emptyMsg");
    grid.innerHTML="";
    if(!results.length){
      empty.innerHTML='<div class="empty">No dishes match. Try fewer filters or a different word.</div>';
      document.getElementById("loadmore").style.display="none";
    }else{
      empty.innerHTML="";
      const slice=results.slice(0,state.shown);
      const frag=document.createDocumentFragment();
      slice.forEach(r=>frag.appendChild(cardEl(r)));
      grid.appendChild(frag);
      document.getElementById("loadmore").style.display = results.length>state.shown ? "block" : "none";
    }
    document.getElementById("count").textContent =
      results.length + (results.length===1?" dish":" dishes") + (state.q.trim()?' for "'+state.q.trim()+'"':"");
  }

  // ---------- modal ----------
  function openModal(r){
    const v=catView(r.category), t=r.time||{}, m=document.getElementById("modal");
    const stats=[
      ["Serves",r.servings],["Prep",(t.prepMinutes||0)+"m"],["Cook",(t.cookMinutes||0)+"m"],
      ["Total",(t.totalMinutes||0)+"m"],["Level",cap(r.difficulty)],["Spice",spiceText(r.spiceLevel)]
    ].map(s=>'<div class="stat">'+s[0]+'<b>'+s[1]+'</b></div>').join("");

    // group ingredients
    const groups={}; (r.ingredients||[]).forEach(i=>{(groups[i.group]=groups[i.group]||[]).push(i);});
    const order=["main","kroeung","seasoning","veg","dressing","garnish","serving","equipment"];
    const gkeys=Object.keys(groups).sort((a,b)=>{
      const ai=order.indexOf(a),bi=order.indexOf(b); return (ai<0?99:ai)-(bi<0?99:bi);
    });
    const ingHtml=gkeys.map(g=>{
      const items=groups[g].map(i=>{
        const qty=[i.quantity,i.unit].filter(x=>x!==undefined&&x!==null&&x!=="").join(" ");
        return '<li><span class="qty">'+esc(qty)+'</span><span class="nm">'+esc(i.item)+
               (i.notes?' <span class="nt">— '+esc(i.notes)+'</span>':'')+'</span></li>';
      }).join("");
      return '<div class="ing-group"><div class="gname">'+esc(g)+'</div><ul class="ings">'+items+'</ul></div>';
    }).join("");

    const stepsHtml=(r.instructions||[]).map(s=>
      '<li><div class="txt">'+esc(s.text)+'</div>'+
      (s.tip?'<div class="tip"><b>Tip:</b> '+esc(s.tip)+'</div>':'')+'</li>'
    ).join("");

    const diet=(r.dietary||[]).map(d=>'<span class="diet">'+d+'</span>').join("");
    const kro=(r.kroeung&&r.kroeung.length)?
      '<div class="kroeung-note"><b>Kroeung (flavour base):</b> '+r.kroeung.map(esc).join(", ")+'</div>':'';

    m.innerHTML=
      '<div class="mhead" style="background:linear-gradient(135deg,'+v.c+','+shade(v.c)+')">'+
        '<button class="mclose" id="mclose">✕</button>'+
        '<div class="big">'+v.e+'</div>'+
        '<h2>'+esc(r.name.en)+'</h2>'+
        '<div class="rom">'+esc(r.name.romanized)+'</div>'+
        '<div class="km">'+esc(r.name.km)+'</div>'+
        '<div class="desc">'+esc(r.description||"")+'</div>'+
        '<div style="margin-top:10px">'+diet+'</div>'+
      '</div>'+
      '<div class="mbody">'+
        '<div class="stats">'+stats+'</div>'+
        kro+
        '<div class="sec-title">Ingredients</div>'+ingHtml+
        '<div class="sec-title">How to cook</div><ol class="steps">'+stepsHtml+'</ol>'+
        (r.equipment&&r.equipment.length?'<div class="sec-title">Equipment</div><div style="font-size:14px">'+r.equipment.map(esc).join(" · ")+'</div>':'')+
      '</div>';
    document.getElementById("overlay").classList.add("open");
    document.body.style.overflow="hidden";
    document.getElementById("mclose").onclick=closeModal;
    document.getElementById("modal").scrollTop=0;
    location.hash = r.slug;
  }
  function closeModal(){
    document.getElementById("overlay").classList.remove("open");
    document.body.style.overflow="";
    if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  }

  // ---------- daily dish ----------
  function dayHash(){
    const d=new Date(); const key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    let h=0; for(let i=0;i<key.length;i++){h=(h*31+key.charCodeAt(i))>>>0;}
    return h;
  }
  function renderDaily(){
    if(!DATA.length) return;
    const r=DATA[dayHash()%DATA.length], v=catView(r.category);
    const el=document.getElementById("daily"); el.style.display="flex";
    el.innerHTML=
      '<div class="emoji" style="background:'+v.c+'22">'+v.e+'</div>'+
      '<div><div class="label">🍴 Dish of the day</div>'+
      '<h2>'+esc(r.name.en)+'</h2>'+
      '<div class="rom">'+esc(r.name.romanized)+' · <span class="km">'+esc(r.name.km)+'</span></div>'+
      '<div class="desc">'+esc(r.description||"")+'</div></div>';
    el.onclick=()=>openModal(r);
  }

  // ---------- helpers ----------
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
  function shade(hex){ // darken a hex color a touch
    const n=parseInt(hex.slice(1),16); let r=(n>>16)-30,g=((n>>8)&255)-30,b=(n&255)-30;
    r=Math.max(0,r);g=Math.max(0,g);b=Math.max(0,b);
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  // ---------- wire up ----------
  const search=document.getElementById("search"), clearBtn=document.getElementById("clearBtn");
  let tmr=null;
  search.addEventListener("input",()=>{
    clearBtn.style.display=search.value?"block":"none";
    clearTimeout(tmr); tmr=setTimeout(()=>{state.q=search.value;state.shown=PAGE;render();},120);
  });
  clearBtn.onclick=()=>{search.value="";clearBtn.style.display="none";state.q="";state.shown=PAGE;render();search.focus();};
  document.getElementById("loadmore").onclick=()=>{state.shown+=PAGE;render();};
  document.getElementById("reset").onclick=()=>{
    state.cat.clear();state.prot.clear();state.diet.clear();state.spice=null;state.q="";
    search.value="";clearBtn.style.display="none";state.shown=PAGE;buildFilters();render();
  };
  document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

  document.getElementById("totalCount").textContent=DATA.length;
  document.getElementById("footCount").textContent=DATA.length;
  buildFilters(); renderDaily(); render();

  // open a dish if the URL has a #slug
  if(location.hash){const slug=location.hash.slice(1);const r=DATA.find(x=>x.slug===slug);if(r)openModal(r);}
})();
</script>
</body>
</html>
