instructions:
- step: 1
  text: Bring the stock to a boil with bruised lemongrass and smashed garlic.
  textKm: ដាំទឹកស៊ុបជាមួយស្លឹកគ្រៃបុក និងខ្ទឹមសបុក។
- step: 2
  text: Add the tofu (cubed and lightly fried until golden) and simmer until almost cooked.
- step: 3
  text: Add the taro stem and simmer until tender.
- step: 4
  text: Season with tamarind, fish sauce and palm sugar; balance to a clean sour-salty-sweet.
  tip: Add tamarind gradually and taste — sourness should brighten, not dominate.
- step: 5
  text: Finish with sawtooth coriander and rice-paddy herb; serve with rice.
