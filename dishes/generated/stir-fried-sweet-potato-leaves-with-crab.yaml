instructions:
- step: 1
  text: 'Prepare the crab: cleaned and quartered.'
  textKm: រៀបចំក្ដាម៖ សម្អាត ហើយកាត់ជា ៤។
- step: 2
  text: Mince the garlic and have the sweet potato leaves washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ស្លឹកដំឡូង ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the crab and stir-fry until the shells turn bright orange, about 12 minutes.
  textKm: ដាក់ក្ដាម ហើយឆា រហូតទាល់តែសំបកក្ដាមមានពណ៌ទឹកក្រូច ប្រហែល 12 នាទី។
- step: 5
  text: Add the sweet potato leaves and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ស្លឹកដំឡូង ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
