instructions:
- step: 1
  text: Slice the squid very thinly and toss with half the lime juice; leave 10 minutes until it turns opaque.
  tip: Use only the freshest seafood/meat for a lime-cured pleah.
- step: 2
  text: Whisk the dressing — lime juice, fish sauce, palm sugar, garlic and chili — until the sugar dissolves.
- step: 3
  text: Combine the squid with lemongrass, shallot, sawtooth coriander & mint.
- step: 4
  text: Pour over the dressing and toss well just before serving.
- step: 5
  text: Pile onto a plate and top with extra herbs, peanuts and fried shallots.
