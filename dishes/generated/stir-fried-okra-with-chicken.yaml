instructions:
- step: 1
  text: 'Prepare the chicken: cut into bite-sized pieces.'
  textKm: រៀបចំសាច់មាន់៖ កាត់ជាដុំៗតូច។
- step: 2
  text: Mince the garlic and have the okra washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង បែកពោះ ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the chicken and stir-fry until cooked through and no longer pink, about 12 minutes.
  textKm: ដាក់សាច់មាន់ ហើយឆា រហូតទាល់តែឆ្អិន ហើយបាត់ពណ៌ផ្កាឈូក ប្រហែល 12 នាទី។
- step: 5
  text: Add the okra and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់បែកពោះ ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
