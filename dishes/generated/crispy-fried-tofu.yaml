instructions:
- step: 1
  text: 'Prepare the tofu: cubed and lightly fried until golden.'
  textKm: រៀបចំតៅហ៊ូ៖ ហាន់ជាគូប ហើយចៀនបន្តិចឱ្យលឿង។
- step: 2
  text: Pat dry and dust lightly with seasoned rice flour.
  textKm: សម្ងួត ហើយប្រឡាក់ម្សៅអង្ករបន្តិច។
- step: 3
  text: Heat oil to 170°C. Fry the tofu until heated through and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
  textKm: កម្ដៅប្រេងដល់ ១៧០°C។ ចៀន តៅហ៊ូ រហូតទាល់តែក្ដៅ ហើយក្រៀម។
- step: 4
  text: Drain on a rack.
  textKm: ច្រោះលើដែកក្រាត។
- step: 5
  text: Serve with sweet chili sauce or tuk trey p'aem.
  textKm: បរិភោគជាមួយទឹកម្ទេសផ្អែម ឬ ទឹកត្រីផ្អែម។
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
