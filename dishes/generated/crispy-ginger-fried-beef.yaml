instructions:
- step: 1
  text: 'Prepare the beef: sliced thin against the grain.'
  textKm: រៀបចំសាច់គោ៖ ហាន់ស្ដើងបញ្ច្រាសខ្សែ។
- step: 2
  text: Pat dry and dust with seasoned flour.
  textKm: សម្ងួត ហើយប្រឡាក់ម្សៅប្រឡាក់។
- step: 3
  text: Heat oil to 170°C. Fry the beef until just browned but still tender and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
  textKm: កម្ដៅប្រេងដល់ ១៧០°C។ ចៀន សាច់គោ រហូតទាល់តែលឿងស្រាល តែនៅទន់ ហើយក្រៀម។
- step: 4
  text: Drain on a rack.
  textKm: ច្រោះលើដែកក្រាត។
- step: 5
  text: Crisp the ginger and garlic in the oil and scatter over the top with spring onion.
  textKm: ចៀនខ្ញី និងខ្ទឹមសក្នុងប្រេងឱ្យក្រៀម ហើយរោយលើជាមួយស្លឹកខ្ទឹមបារាំង។
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
