instructions:
- step: 1
  text: 'Prepare the beef: sliced thin against the grain.'
  textKm: រៀបចំសាច់គោ៖ ហាន់ស្ដើងបញ្ច្រាសខ្សែ។
- step: 2
  text: Bring stock to a boil and stir in the lemongrass kroeung.
  tip: Bruising or pounding the aromatics first lets them give up more flavour.
- step: 3
  text: Add the beef and simmer until just browned but still tender, about 8 minutes.
  textKm: ដាក់សាច់គោ ហើយដាំ រហូតទាល់តែលឿងស្រាល តែនៅទន់ ប្រហែល 8 នាទី។
- step: 4
  text: Add the vegetables (water mimosa, tomato, pineapple) and simmer until just tender.
- step: 5
  text: Season with fish sauce and palm sugar, then balance with tamarind paste.
  textKm: បន្ថែមទឹកត្រី និងស្ករត្នោត។
- step: 6
  text: Taste — it should sing of salty, sweet and sour. Finish with rice-paddy herb (ngo om) and sawtooth coriander.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
