instructions:
- step: 1
  text: Smash the garlic and rinse the fresh green peppercorn strands.
  tip: Pounding releases more aroma than blending, but a blender is fine.
- step: 2
  text: 'Prepare the mixed vegetables: cut into bite-sized pieces.'
  textKm: រៀបចំបន្លែ៖ កាត់ជាដុំៗតូច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat until shimmering.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the aromatics and stir-fry 1–2 minutes until fragrant and the raw smell is gone.
  textKm: ដាក់គ្រឿងផ្សំ ហើយឆា ១–២ នាទី រហូតទាល់តែឈ្ងុយ និងបាត់ក្លិនឆៅ។
- step: 5
  text: Add the mixed vegetables and stir-fry until tender-crisp, about 7 minutes.
  textKm: ដាក់បន្លែ ហើយឆា រហូតទាល់តែទន់និងក្រៀម ប្រហែល 7 នាទី។
- step: 6
  text: Add sliced chili and a handful of holy basil.
- step: 7
  text: Season with fish sauce, palm sugar and oyster sauce, light soy sauce and a small splash of water; toss to coat.
- step: 8
  text: Taste and adjust, then finish with extra green peppercorns.
- step: 9
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
