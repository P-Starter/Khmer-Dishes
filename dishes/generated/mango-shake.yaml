ingredients:
- group: main
  item: ripe mango
  quantity: 1
  unit: cup
  notes: chilled
  notesKm: ត្រជាក់
- group: seasoning
  item: sweetened condensed milk
  quantity: 2
  unit: tbsp
  itemKm: ទឹកដោះគោផ្អែម
- group: main
  item: crushed ice
  quantity: 1
  unit: cup
  itemKm: ទឹកកកបុក
- group: seasoning
  item: sugar syrup
  quantity: 1
  unit: tbsp
  notes: to taste
  itemKm: ស៊ីរ៉ូស្ករ
  notesKm: តាមរសជាតិ
- group: seasoning
  item: a pinch of salt
  quantity: 1
  unit: pinch
  itemKm: អំបិលបន្តិច
instructions:
- step: 1
  text: Add the mango, condensed milk, ice and a little syrup to a blender.
  textKm: ដាក់ mango ទឹកដោះគោផ្អែម ទឹកកក និងស៊ីរ៉ូបន្តិចចូលម៉ាសុីនកិន។
- step: 2
  text: Blend until smooth and frothy; taste and adjust sweetness with a pinch of salt.
  tip: A pinch of salt makes tropical fruit taste sweeter and rounder.
  textKm: កិនរហូតរលោង និងព្រួស; ភ្លក់ ហើយកែតម្រូវភាពផ្អែមដោយអំបិលបន្តិច។
- step: 3
  text: Pour into a tall glass and serve immediately over ice.
  textKm: ស្នូរចូលកែវវែង ហើយបរិភោគភ្លាមៗលើទឹកកក។
