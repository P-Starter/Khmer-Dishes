instructions:
- step: 1
  text: Fry the red kroeung in a little coconut cream until the oil splits and it smells fragrant.
  textKm: ឆាគ្រឿងក្រហមជាមួយខ្ទិះដូងបន្តិចរហូតប្រេងបែក និងឈ្ងុយ។
- step: 2
  text: Stir in the ground roasted peanuts and toasted coconut.
  textKm: កូរសណ្ដែកដីលីង និងដូងលីង។
- step: 3
  text: Add the mixed vegetables (cut into bite-sized pieces) and seal in the paste.
  textKm: បន្ថែម បន្លែ (កាត់ជាដុំៗតូច) ហើយចូលក្នុងគ្រឿង។
- step: 4
  text: Pour in the coconut milk and add the potato; simmer gently.
  textKm: ស្នូរទឹកដូងចូល និងបន្ថែមដំឡូងបារាំង; ដាំថ្នមៗ។
- step: 5
  text: Simmer until tender-crisp and the potato is soft, about 22 minutes.
  textKm: ដាំ រហូតទាល់តែទន់និងក្រៀម ហើយដំឡូងបារាំងទន់ ប្រហែល 22 នាទី។
- step: 6
  text: Season with fish sauce and palm sugar; it should be mild, nutty and rich.
  textKm: បន្ថែមទឹកត្រី និងស្ករត្នោត។
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
