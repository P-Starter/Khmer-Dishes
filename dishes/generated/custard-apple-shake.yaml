instructions:
- step: 1
  text: Add the custard apple, condensed milk, ice and a little syrup to a blender.
- step: 2
  text: Blend until smooth and frothy; taste and adjust sweetness with a pinch of salt.
  tip: A pinch of salt makes tropical fruit taste sweeter and rounder.
- step: 3
  text: Pour into a tall glass and serve immediately over ice.
