instructions:
- step: 1
  text: Pound the kroeung smooth and simmer in stock with strained prahok.
- step: 2
  text: Add the flaked grilled fish (and your chosen clams) and the coconut milk; simmer into a fragrant gravy.
- step: 3
  text: Season with fish sauce and palm sugar to a savoury, slightly sweet balance.
  textKm: បន្ថែមទឹកត្រី និងស្ករត្នោត។
- step: 4
  text: Loosen the fresh rice vermicelli into nests in each bowl.
- step: 5
  text: Ladle the warm gravy over and pile high with raw banana blossom, cucumber, long beans and herbs.
