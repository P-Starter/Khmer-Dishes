ingredients:
- group: main
  item: job's tears
  quantity: 250
  unit: g
  notes: prepared / soaked as needed
- group: main
  item: coconut milk
  quantity: 400
  unit: ml
  itemKm: ទឹកដូង
- group: seasoning
  item: palm sugar
  quantity: 5
  unit: tbsp
  itemKm: ស្ករត្នោត
- group: seasoning
  item: salt
  quantity: 0.25
  unit: tsp
  itemKm: អំបិល
- group: seasoning
  item: pandan leaf
  quantity: 2
  unit: leaves
  notes: knotted
  itemKm: ស្លឹកតើយ
  notesKm: ចំរូង
- group: main
  item: tapioca pearls
  quantity: 3
  unit: tbsp
  notes: optional, for body
  itemKm: សាគូ
  notesKm: ស្ម័គ្រ សម្រាប់រាងក្រាស់
instructions:
- step: 1
  text: Simmer the job's tears in water with pandan until soft.
  textKm: ដាំ ស្រូវសាលី ក្នុងទឹកជាមួយស្លឹកតើយរហូតទន់។
- step: 2
  text: Add palm sugar and a pinch of salt; stir until dissolved.
  textKm: បន្ថែមស្ករត្នោត និងអំបិលបន្តិច; កូររហូតស្កររលាយ។
- step: 3
  text: Pour in the coconut milk and warm through gently without hard-boiling.
  tip: Boiling can split the coconut milk — keep it at a gentle simmer.
  textKm: ស្នូរទឹកដូងចូល កម្ដៅថ្នមៗ កុំឱ្យដាំខ្លាំង។
- step: 4
  text: Serve warm or over ice as a sweet dessert soup (bong-aem).
  textKm: បរិភោគក្ដៅ ឬ លើទឹកកកជាបបរផ្អែម (បង្អែម)។
