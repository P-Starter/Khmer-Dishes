  romanized: Bobor Pongaem Srov Sali
  en: Sweet Coconut Soup with Job's Tears
category: dessert
subcategory: sweet-soup
cuisine: Khmer
description: A warm Khmer sweet soup of job's tears in pandan-scented coconut milk.
descriptionKm: បបរផ្អែមស្រូវសាលី ក្នុងទឹកដូងស្លឹកតើយ។
