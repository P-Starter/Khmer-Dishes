instructions:
- step: 1
  text: Fry the garlic and ginger, then stir in the fermented soybean paste.
  tip: Pounding releases more aroma than blending, but a blender is fine.
- step: 2
  text: 'Prepare the squid: cleaned and scored into rings.'
  textKm: រៀបចំមឹក៖ សម្អាត ហើយហាន់ជាកង់។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat until shimmering.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the aromatics and stir-fry 1–2 minutes until fragrant and the raw smell is gone.
  textKm: ដាក់គ្រឿងផ្សំ ហើយឆា ១–២ នាទី រហូតទាល់តែឈ្ងុយ និងបាត់ក្លិនឆៅ។
- step: 5
  text: Add the squid and stir-fry until just opaque (do not overcook), about 4 minutes.
  textKm: ដាក់មឹក ហើយឆា រហូតទាល់តែទើបឆ្អិន (កុំឆ្អិនពេក) ប្រហែល 4 នាទី។
- step: 6
  text: Add sliced chili and big lengths of spring onion.
- step: 7
  text: Season with fish sauce, palm sugar and palm sugar and a small splash of water; toss to coat.
- step: 8
  text: Taste and adjust, then finish with spring onion.
- step: 9
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
