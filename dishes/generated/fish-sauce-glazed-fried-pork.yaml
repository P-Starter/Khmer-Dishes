instructions:
- step: 1
  text: 'Prepare the pork: cut into thin slices.'
  textKm: រៀបចំសាច់ជ្រូក៖ ហាន់ជាបន្ទះស្ដើង។
- step: 2
  text: Pat dry; no batter needed.
  textKm: សម្ងួត; មិនត្រូវការម្សៅ។
- step: 3
  text: Heat oil to 170°C. Fry the pork until cooked through and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
  textKm: កម្ដៅប្រេងដល់ ១៧០°C។ ចៀន សាច់ជ្រូក រហូតទាល់តែឆ្អិន ហើយក្រៀម។
- step: 4
  text: Drain on a rack.
  textKm: ច្រោះលើដែកក្រាត។
- step: 5
  text: Toss the fried pieces in the caramel until glazed; finish with chili and spring onion.
  textKm: លាយសាច់ចៀនជាមួយស៊ីរ៉ូរហូតភ្លឺ; ដាក់ម្ទេស និងស្លឹកខ្ទឹមបារាំងនៅខាងលើ។
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
