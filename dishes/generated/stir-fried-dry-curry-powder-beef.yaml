instructions:
- step: 1
  text: Fry the garlic and onion, then bloom the curry powder in the oil.
  tip: Pounding releases more aroma than blending, but a blender is fine.
- step: 2
  text: 'Prepare the beef: sliced thin against the grain.'
  textKm: រៀបចំសាច់គោ៖ ហាន់ស្ដើងបញ្ច្រាសខ្សែ។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat until shimmering.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the aromatics and stir-fry 1–2 minutes until fragrant and the raw smell is gone.
  textKm: ដាក់គ្រឿងផ្សំ ហើយឆា ១–២ នាទី រហូតទាល់តែឈ្ងុយ និងបាត់ក្លិនឆៅ។
- step: 5
  text: Add the beef and stir-fry until just browned but still tender, about 8 minutes.
  textKm: ដាក់សាច់គោ ហើយឆា រហូតទាល់តែលឿងស្រាល តែនៅទន់ ប្រហែល 8 នាទី។
- step: 6
  text: Add celery and beaten egg, tossing until the egg ribbons through.
- step: 7
  text: Season with fish sauce, palm sugar and oyster sauce, evaporated milk and a small splash of water; toss to coat.
- step: 8
  text: Taste and adjust, then finish with spring onion and ground white pepper.
- step: 9
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
