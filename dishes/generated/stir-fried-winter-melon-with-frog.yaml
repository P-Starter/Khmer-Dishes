instructions:
- step: 1
  text: 'Prepare the frog: cleaned and jointed.'
  textKm: រៀបចំកង្កែប៖ សម្អាត ហើយកាត់តាមសន្លាក់។
- step: 2
  text: Mince the garlic and have the winter melon washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ត្រសក់ ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the frog and stir-fry until tender, about 15 minutes.
  textKm: ដាក់កង្កែប ហើយឆា រហូតទាល់តែទន់ ប្រហែល 15 នាទី។
- step: 5
  text: Add the winter melon and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ត្រសក់ ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
