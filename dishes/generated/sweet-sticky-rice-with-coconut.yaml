ingredients:
- group: main
  item: glutinous (sticky) rice
  quantity: 2
  unit: cups
  notes: soaked overnight
  itemKm: បាយដំណើប
  notesKm: ត្រាំមួយយប់
- group: main
  item: coconut milk
  quantity: 400
  unit: ml
  itemKm: ទឹកដូង
- group: seasoning
  item: palm sugar
  quantity: 4
  unit: tbsp
  itemKm: ស្ករត្នោត
- group: seasoning
  item: salt
  quantity: 0.5
  unit: tsp
  itemKm: អំបិល
- group: seasoning
  item: pandan leaf
  quantity: 2
  unit: leaves
  notes: knotted
  itemKm: ស្លឹកតើយ
  notesKm: ចំរូង
- group: main
  item: coconut
  quantity: 1
  unit: portion
  notes: to serve
  itemKm: ដូង
  notesKm: សម្រាប់បរិភោគ
instructions:
- step: 1
  text: Steam the soaked sticky rice over high heat 25–30 minutes until tender.
  textKm: ចំហុយបាយដំណើបត្រាំលើភ្លើងខ្លាំង ២៥–៣០ នាទីរហូតទន់។
- step: 2
  text: Warm the coconut milk with palm sugar, salt and pandan until the sugar dissolves (do not boil).
  textKm: កម្ដៅទឹកដូងជាមួយស្ករត្នោត អំបិល និងស្លឹកតើយរហូតស្កររលាយ (កុំដាំ)។
- step: 3
  text: Fold most of the sweet coconut milk through the hot rice and rest 15 minutes to absorb.
  tip: Keep a little coconut sauce back to spoon over at the end.
  textKm: លាយទឹកដូងផ្អែមភាគច្រើនជាមួយបាយក្ដៅ ហើយទុក ១៥ នាទីឱ្យជ្រាប។
- step: 4
  text: Serve the sticky rice with the coconut and the reserved coconut sauce.
  textKm: បរិភោគបាយដំណើបជាមួយ ដូង និងទឹកដូងដែលទុកសល់។
