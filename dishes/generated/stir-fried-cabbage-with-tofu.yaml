instructions:
- step: 1
  text: 'Prepare the tofu: cubed and lightly fried until golden.'
  textKm: រៀបចំតៅហ៊ូ៖ ហាន់ជាគូប ហើយចៀនបន្តិចឱ្យលឿង។
- step: 2
  text: Mince the garlic and have the cabbage washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ស្ពៃក្ដោប ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the tofu and stir-fry until heated through, about 6 minutes.
  textKm: ដាក់តៅហ៊ូ ហើយឆា រហូតទាល់តែក្ដៅ ប្រហែល 6 នាទី។
- step: 5
  text: Add the cabbage and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ស្ពៃក្ដោប ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
