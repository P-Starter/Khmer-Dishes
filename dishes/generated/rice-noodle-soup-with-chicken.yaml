instructions:
- step: 1
  text: Simmer the stock with dried seafood, rock sugar and a little fish sauce for 30 minutes; keep hot.
  tip: Skim the broth often to keep it crystal clear.
- step: 2
  text: Cook the chicken (cut into bite-sized pieces) in the broth until done; slice if needed.
- step: 3
  text: Blanch the noodles and bean sprouts; divide between bowls.
- step: 4
  text: Top with the chicken and ladle over the hot broth.
- step: 5
  text: Finish with fried garlic oil, spring onion and coriander; serve with lime, chili and herbs on the side.
