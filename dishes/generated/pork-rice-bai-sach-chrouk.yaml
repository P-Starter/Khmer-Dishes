description: Cambodia's classic breakfast — grilled marinated pork over broken rice.
descriptionKm: បាយសាច់ជ្រូក — ភ្ញាក់ព្រឹកដ៏ល្បី សាច់ជ្រូកអាំងលើបាយចំការ។
