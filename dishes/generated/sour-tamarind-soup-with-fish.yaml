instructions:
- step: 1
  text: 'Prepare the fish: cut into thick fillet slices.'
  textKm: រៀបចំត្រី៖ ហាន់ជាបន្ទះក្រាស់។
- step: 2
  text: Bring stock to a boil with smashed garlic and lemongrass.
  tip: Bruising or pounding the aromatics first lets them give up more flavour.
- step: 3
  text: Add the fish and simmer until the flesh turns opaque and flakes, about 10 minutes.
  textKm: ដាក់ត្រី ហើយដាំ រហូតទាល់តែសាច់ត្រីពណ៌ស និងបែកជាដុំៗ ប្រហែល 10 នាទី។
- step: 4
  text: Add the vegetables (pineapple, tomato, bean sprouts, taro stem) and simmer until just tender.
- step: 5
  text: Season with fish sauce and palm sugar, then balance with tamarind paste.
  textKm: បន្ថែមទឹកត្រី និងស្ករត្នោត។
- step: 6
  text: Taste — it should sing of salty, sweet and sour. Finish with fried garlic, sawtooth coriander and rice-paddy herb.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
