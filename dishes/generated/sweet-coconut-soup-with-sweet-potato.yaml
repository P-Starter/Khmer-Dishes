  km: បបរផ្អែមដំឡូងជ្វា
  romanized: Bobor Pongaem Damlong Chvea
  en: Sweet Coconut Soup with Sweet Potato
category: dessert
subcategory: sweet-soup
cuisine: Khmer
description: A warm Khmer sweet soup of sweet potato in pandan-scented coconut milk.
descriptionKm: បបរផ្អែមដំឡូងជ្វា ក្នុងទឹកដូងស្លឹកតើយ។
