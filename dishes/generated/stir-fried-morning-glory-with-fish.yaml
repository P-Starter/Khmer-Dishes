instructions:
- step: 1
  text: 'Prepare the fish: cut into thick fillet slices.'
  textKm: រៀបចំត្រី៖ ហាន់ជាបន្ទះក្រាស់។
- step: 2
  text: Mince the garlic and have the morning glory washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ត្រកួន ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the fish and stir-fry until the flesh turns opaque and flakes, about 10 minutes.
  textKm: ដាក់ត្រី ហើយឆា រហូតទាល់តែសាច់ត្រីពណ៌ស និងបែកជាដុំៗ ប្រហែល 10 នាទី។
- step: 5
  text: Add the morning glory and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ត្រកួន ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
