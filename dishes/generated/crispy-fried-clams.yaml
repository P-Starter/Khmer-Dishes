instructions:
- step: 1
  text: 'Prepare the clams: scrubbed.'
  textKm: រៀបចំងាវ៖ សម្អាតសំបក។
- step: 2
  text: Pat dry and dust lightly with seasoned rice flour.
- step: 3
  text: Heat oil to 170°C. Fry the clams until the shells open and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
- step: 4
  text: Drain on a rack.
- step: 5
  text: Serve with sweet chili sauce or tuk trey p'aem.
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
