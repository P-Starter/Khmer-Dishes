instructions:
- step: 1
  text: Pound the red kroeung to a very smooth paste — smoothness is everything in amok.
- step: 2
  text: 'Prepare the mixed vegetables: cut into bite-sized pieces.'
  textKm: រៀបចំបន្លែ៖ កាត់ជាដុំៗតូច។
- step: 3
  text: In a bowl, whisk the kroeung with coconut milk, egg, fish sauce and palm sugar until thick and creamy.
  tip: Add the coconut milk a little at a time so the mixture emulsifies.
- step: 4
  text: Fold in the mixed vegetables until well coated.
- step: 5
  text: Line banana-leaf cups with a soft leaf, spoon in the mixture and top with coconut cream.
- step: 6
  text: Steam over medium heat 20–25 minutes until set like a soft custard.
- step: 7
  text: Garnish with coconut cream and shredded kaffir lime leaf; serve with rice.
