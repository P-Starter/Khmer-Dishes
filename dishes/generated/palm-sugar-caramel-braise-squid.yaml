  quantity: 2
  unit: whole
  notes: optional
  itemKm: ពងមាន់ស្ងោរ
- group: kroeung
  item: garlic
  quantity: 4
  unit: cloves
  notes: smashed
  itemKm: ខ្ទឹមស
  notesKm: បុក
