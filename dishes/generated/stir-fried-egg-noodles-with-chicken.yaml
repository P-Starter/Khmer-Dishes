instructions:
- step: 1
  text: Soak or loosen the noodles so they don't clump.
- step: 2
  text: Heat a wok screaming hot; fry the garlic, then the chicken until cooked through and no longer pink.
- step: 3
  text: Push aside, scramble the egg, then add the noodles and Chinese broccoli.
- step: 4
  text: Season with oyster sauce, dark soy and a pinch of sugar; toss over high heat until smoky.
  tip: Don't overcrowd — fry in two batches for proper 'wok hei'.
- step: 5
  text: Add bean sprouts at the end, toss once and plate. Top with herbs and fried garlic oil.
