instructions:
- step: 1
  text: 'Prepare the crab: cleaned and quartered.'
  textKm: រៀបចំក្ដាម៖ សម្អាត ហើយកាត់ជា ៤។
- step: 2
  text: Coat in a light tempura-style batter and fry until crisp.
- step: 3
  text: Heat oil to 170°C. Fry the crab until the shells turn bright orange and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
- step: 4
  text: Drain on a rack.
- step: 5
  text: Pour the warm sweet-and-sour sauce over the fried pieces just before serving.
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
