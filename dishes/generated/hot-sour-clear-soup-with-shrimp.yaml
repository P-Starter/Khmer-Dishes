instructions:
- step: 1
  text: 'Prepare the shrimp: peeled and deveined.'
  textKm: រៀបចំបង្គា៖ ចេញសំបក និងសរសៃ។
- step: 2
  text: Bring stock to a boil with bruised lemongrass and galangal.
  tip: Bruising or pounding the aromatics first lets them give up more flavour.
- step: 3
  text: Add the shrimp and simmer until they curl and turn pink, about 5 minutes.
  textKm: ដាក់បង្គា ហើយដាំ រហូតទាល់តែបង្គាក្រឡុំ និងមានពណ៌ផ្កាឈូក ប្រហែល 5 នាទី។
- step: 4
  text: Add the vegetables (tomato, oyster mushroom, napa cabbage) and simmer until just tender.
- step: 5
  text: Season with fish sauce and palm sugar, then balance with lime juice.
  textKm: បន្ថែមទឹកត្រី និងស្ករត្នោត។
- step: 6
  text: Taste — it should sing of salty, sweet and sour. Finish with coriander, chili and a final squeeze of lime.
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
