instructions:
- step: 1
  text: Smash the garlic and shred a generous thumb of young ginger.
  tip: Pounding releases more aroma than blending, but a blender is fine.
  textKm: បុកខ្ទឹមស ហើយចិតខ្ញីខ្ចីមួយមេដៃ។
- step: 2
  text: 'Prepare the clams: scrubbed.'
  textKm: រៀបចំងាវ៖ សម្អាតសំបក។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat until shimmering.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the aromatics and stir-fry 1–2 minutes until fragrant and the raw smell is gone.
  textKm: ដាក់គ្រឿងផ្សំ ហើយឆា ១–២ នាទី រហូតទាល់តែឈ្ងុយ និងបាត់ក្លិនឆៅ។
- step: 5
  text: Add the clams and stir-fry until the shells open, about 6 minutes.
  textKm: ដាក់ងាវ ហើយឆា រហូតទាល់តែសំបករបោះ ប្រហែល 6 នាទី។
- step: 6
  text: Add sliced onion, spring onion and wood-ear mushroom; stir-fry briefly.
  textKm: បន្ថែមខ្ទឹមបារាំងហាន់ ស្លឹកខ្ទឹមបារាំង និងផ្សិតត្រចៀកជ្រូក; ឆាបន្តិច។
- step: 7
  text: Season with fish sauce, palm sugar and oyster sauce, light soy sauce and a small splash of water; toss to coat.
  textKm: បន្ថែមទឹកត្រី ស្ករត្នោត និងគ្រឿងផ្សំផ្សេងៗ។ កូរឱ្យសម។
- step: 8
  text: Taste and adjust, then finish with ground white pepper and spring onion.
  textKm: ភ្លក់ ហើយកែតម្រូវរសជាតិ បន្ទាប់មកដាក់ ground white pepper and spring onion។
- step: 9
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
