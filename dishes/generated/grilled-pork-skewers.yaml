description: Lemongrass-marinated pork skewers grilled over charcoal.
descriptionKm: សាច់ជ្រូកអាំង — សាច់ជ្រូកប្រឡាក់ស្លឹកគ្រៃ អាំងលើភ្លើងធ្យូង។
