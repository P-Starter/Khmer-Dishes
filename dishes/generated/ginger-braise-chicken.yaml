  quantity: 3
  unit: tbsp
  itemKm: ទឹកត្រី
- group: kroeung
  item: young ginger
  quantity: 1
  unit: thumb
  notes: julienned
  itemKm: ខ្ញីខ្ចី
  notesKm: ហាន់ស្ដើងជាខ្សែ
- group: main
  item: coconut water
  quantity: 200
  unit: ml
  itemKm: ទឹកដូងខ្ចី
- group: kroeung
  item: garlic
  quantity: 3
  unit: cloves
  notes: smashed
  itemKm: ខ្ទឹមស
  notesKm: បុក
