instructions:
- step: 1
  text: Melt the palm sugar in a heavy pot until it caramelises to a deep amber.
  tip: Take the caramel just to amber — too dark and it turns bitter.
  textKm: រលាយស្ករត្នោតក្នុងឆ្នាំងធ្ងន់ រហូតប្រែជាពណ៌ត្នោតចាស់។
- step: 2
  text: Add the smashed garlic and the duck (chopped into pieces); turn to coat in the caramel.
  textKm: បន្ថែមខ្ទឹមសបុក និង សាច់ទា (កាត់ជាដុំៗ)។ លាយឱ្យសាច់ស្រូបនឹងស៊ីរ៉ូ។
- step: 3
  text: Add fish sauce and the braising liquid, plus the other aromatics.
  textKm: បន្ថែមទឹកត្រី ទឹកស្ល និងគ្រឿងផ្សំផ្សេងៗ។
- step: 4
  text: Cover and braise gently until until tender and the sauce is syrupy, about 45 minutes.
  textKm: គ្របគម្រប ហើយដាំថ្នមៗរហូត រហូតទាល់តែទន់ ហើយទឹកក្រាស់ ប្រហែល 45 នាទី។
- step: 5
  text: Uncover and reduce until glossy and clinging.
  textKm: បើកគម្រប ដាំបន្តរហូតទឹកក្រាស់ និងភ្លឺ។
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
