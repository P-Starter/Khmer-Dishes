instructions:
- step: 1
  text: 'Prepare the clams: scrubbed.'
  textKm: រៀបចំងាវ៖ សម្អាតសំបក។
- step: 2
  text: Arrange on a heatproof plate and scatter over the aromatics.
  textKm: តម្រៀបលើចានធន់នឹងភ្លើង ហើយរោយគ្រឿងផ្សំខាងលើ។
- step: 3
  text: Steam over rapidly boiling water until the shells open.
  tip: Don't over-steam — pull it the moment it is just cooked to keep it tender.
  textKm: ចំហុយលើទឹកដាំខ្លាំង រហូតទាល់តែសំបករបោះ។
- step: 4
  text: Drizzle over the sauce, top with the fresh garnish, and serve with rice.
  textKm: ស្នូរទឹកជ្រលក់ពីលើ រួចដាក់គ្រឿងស្រស់ខាងលើ ហើយបរិភោគជាមួយបាយ។
