instructions:
- step: 1
  text: 'Prepare the duck: chopped into pieces.'
  textKm: រៀបចំសាច់ទា៖ កាត់ជាដុំៗ។
- step: 2
  text: Mince the garlic and have the eggplant washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ត្រប់ ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the duck and stir-fry until tender, about 25 minutes.
  textKm: ដាក់សាច់ទា ហើយឆា រហូតទាល់តែទន់ ប្រហែល 25 នាទី។
- step: 5
  text: Add the eggplant and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ត្រប់ ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
  textKm: បន្ថែមទឹកអយស្ទ័រ ទឹកត្រី និងស្ករត្នោតបន្តិច។ កូរលឿនៗ។
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
