instructions:
- step: 1
  text: Blend lemongrass kroeung with fish sauce, palm sugar and a little oil into a marinade.
- step: 2
  text: Coat the squid (cleaned and scored into rings) in the marinade and rest at least 30 minutes (overnight is better).
  tip: Marinating overnight gives the deepest flavour and colour.
- step: 3
  text: Light a charcoal grill and let it burn down to glowing embers (or heat a grill pan).
- step: 4
  text: Grill the squid over medium coals, turning and basting, until just opaque (do not overcook).
- step: 5
  text: Serve with tuk meric — lime juice, salt, black Kampot pepper and chili.
- step: 6
  text: Serve with steamed rice and fresh herbs and cucumber.
