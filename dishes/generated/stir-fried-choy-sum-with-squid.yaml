instructions:
- step: 1
  text: 'Prepare the squid: cleaned and scored into rings.'
  textKm: រៀបចំមឹក៖ សម្អាត ហើយហាន់ជាកង់។
- step: 2
  text: Mince the garlic and have the choy sum washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ស្ពៃផ្កា ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the squid and stir-fry until just opaque (do not overcook), about 4 minutes.
  textKm: ដាក់មឹក ហើយឆា រហូតទាល់តែទើបឆ្អិន (កុំឆ្អិនពេក) ប្រហែល 4 នាទី។
- step: 5
  text: Add the choy sum and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ស្ពៃផ្កា ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
  textKm: បន្ថែមទឹកអយស្ទ័រ ទឹកត្រី និងស្ករត្នោតបន្តិច។ កូរលឿនៗ។
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
