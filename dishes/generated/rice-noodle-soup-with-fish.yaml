  itemKm: មឹកស្ងួត ឬ បង្គា
  notesKm: សម្រាប់ទឹកស៊ុប
- group: seasoning
  item: rock sugar
  quantity: 1
  unit: tsp
  itemKm: ស្ករអំពៅ
