instructions:
- step: 1
  text: Rub generously with salt, smashed garlic and white pepper.
- step: 2
  text: Coat the tofu (cubed and lightly fried until golden) in the marinade and rest at least 30 minutes (overnight is better).
  tip: Marinating overnight gives the deepest flavour and colour.
- step: 3
  text: Light a charcoal grill and let it burn down to glowing embers (or heat a grill pan).
- step: 4
  text: Grill the tofu over medium coals, turning and basting, until heated through.
- step: 5
  text: Serve with tuk trey p'aem — sweet-sour fish-sauce dip with chili and peanuts.
- step: 6
  text: Serve with steamed rice and fresh herbs and cucumber.
