ingredients:
- group: main
  item: fish
  quantity: 500
  unit: g
  notes: cut into thick fillet slices
  itemKm: ត្រី
  notesKm: ហាន់ជាបន្ទះក្រាស់
- group: seasoning
  item: rice flour
  quantity: 4
  unit: tbsp
  itemKm: ម្សៅអង្ករ
- group: seasoning
  item: young ginger
  quantity: 1
  unit: thumb
  notes: finely julienned
  itemKm: ខ្ញីខ្ចី
- group: seasoning
  item: garlic
  quantity: 4
  unit: cloves
  notes: sliced
  itemKm: ខ្ទឹមស
  notesKm: ហាន់
- group: seasoning
  item: oil for frying
  quantity: 500
  unit: ml
  itemKm: ប្រេងសម្រាប់ចៀន
- group: serving
  item: steamed jasmine rice
  quantity: 4
  unit: servings
  notes: to serve
  itemKm: បាយម្លិះ
  notesKm: សម្រាប់បរិភោគ
instructions:
- step: 1
  text: 'Prepare the fish: cut into thick fillet slices.'
  textKm: រៀបចំត្រី៖ ហាន់ជាបន្ទះក្រាស់។
- step: 2
  text: Pat dry and dust with seasoned flour.
  textKm: សម្ងួត ហើយប្រឡាក់ម្សៅប្រឡាក់។
- step: 3
  text: Heat oil to 170°C. Fry the fish until the flesh turns opaque and flakes and crisp.
  tip: Fry in small batches so the oil stays hot and the crust stays crisp.
  textKm: កម្ដៅប្រេងដល់ ១៧០°C។ ចៀន ត្រី រហូតទាល់តែសាច់ត្រីពណ៌ស និងបែកជាដុំៗ ហើយក្រៀម។
- step: 4
  text: Drain on a rack.
  textKm: ច្រោះលើដែកក្រាត។
- step: 5
  text: Crisp the ginger and garlic in the oil and scatter over the top with spring onion.
  textKm: ចៀនខ្ញី និងខ្ទឹមសក្នុងប្រេងឱ្យក្រៀម ហើយរោយលើជាមួយស្លឹកខ្ទឹមបារាំង។
- step: 6
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
