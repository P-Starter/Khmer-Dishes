instructions:
- step: 1
  text: Pound the bird's-eye chili and garlic to a rough paste.
  tip: Pounding releases more aroma than blending, but a blender is fine.
- step: 2
  text: 'Prepare the pork: cut into thin slices.'
  textKm: រៀបចំសាច់ជ្រូក៖ ហាន់ជាបន្ទះស្ដើង។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat until shimmering.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the aromatics and stir-fry 1–2 minutes until fragrant and the raw smell is gone.
  textKm: ដាក់គ្រឿងផ្សំ ហើយឆា ១–២ នាទី រហូតទាល់តែឈ្ងុយ និងបាត់ក្លិនឆៅ។
- step: 5
  text: Add the pork and stir-fry until cooked through, about 12 minutes.
  textKm: ដាក់សាច់ជ្រូក ហើយឆា រហូតទាល់តែឆ្អិន ប្រហែល 12 នាទី។
- step: 6
  text: Add long beans, then pile in holy basil at the end.
- step: 7
  text: Season with fish sauce, palm sugar and oyster sauce, dark soy sauce and a small splash of water; toss to coat.
- step: 8
  text: Taste and adjust, then finish with more holy basil.
- step: 9
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
