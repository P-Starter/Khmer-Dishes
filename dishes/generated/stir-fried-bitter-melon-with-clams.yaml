instructions:
- step: 1
  text: 'Prepare the clams: scrubbed.'
  textKm: រៀបចំងាវ៖ សម្អាតសំបក។
- step: 2
  text: Mince the garlic and have the bitter melon washed and cut.
  textKm: កិនខ្ទឹមស ហើយលាង ម្រះ ឱ្យស្អាតហើយកាត់រួច។
- step: 3
  text: Heat 2 tbsp oil in a wok over high heat; fry the garlic until fragrant.
  textKm: ដាក់ប្រេង ២ ស្លាបព្រាក្នុងខ្ទះ ហើយដុំឱ្យក្ដៅខ្លាំង។
- step: 4
  text: Add the clams and stir-fry until the shells open, about 6 minutes.
  textKm: ដាក់ងាវ ហើយឆា រហូតទាល់តែសំបករបោះ ប្រហែល 6 នាទី។
- step: 5
  text: Add the bitter melon and stir-fry over high heat until tender-crisp.
  tip: Keep the heat high so the vegetable stays bright and never stews.
  textKm: ដាក់ម្រះ ហើយឆាលើភ្លើងខ្លាំង រហូតទាល់តែទន់និងក្រៀម។
- step: 6
  text: Season with oyster sauce, fish sauce and a pinch of palm sugar; toss quickly.
  textKm: បន្ថែមទឹកអយស្ទ័រ ទឹកត្រី និងស្ករត្នោតបន្តិច។ កូរលឿនៗ។
- step: 7
  text: Serve hot with steamed jasmine rice.
  textKm: បរិភោគជាមួយបាយក្ដៅ។
