- group: seasoning
  item: fish sauce
  quantity: 3
  unit: tbsp
  itemKm: ទឹកត្រី
- group: seasoning
  item: Kampot black pepper
  quantity: 1
  unit: tbsp
  notes: coarsely cracked
  itemKm: ម្រេចខ្មៅកំពត
  notesKm: បុកសុះៗ
- group: main
  item: coconut water
  quantity: 200
  unit: ml
  itemKm: ទឹកដូងខ្ចី
- group: kroeung
  item: garlic
  quantity: 4
  unit: cloves
  notes: smashed
  itemKm: ខ្ទឹមស
  notesKm: បុក
