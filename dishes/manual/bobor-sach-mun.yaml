id: khm-0010
slug: bobor-sach-mun
name:
  km: បបរសាច់មាន់
  romanized: Bobor Sach Mun
  en: Chicken Rice Porridge
category: noodles
subcategory: signature
cuisine: Khmer
description: "The Khmer breakfast bowl — silky chicken-and-ginger rice porridge topped with fried garlic oil, spring onion, white pepper and a squeeze of lime. Comforting any hour of the day."
descriptionKm: "បបរសាច់មាន់ — ម្ហូបពេលព្រឹករបស់ខ្មែរ បបរបាយមាន់ផ្សំជាមួយខ្ញី រលោងក្រាស់ ដាក់ប្រេងខ្ទឹមចៀន ស្លឹកខ្ទឹមបារាំង ម្រេចស និងទឹកក្រូចឆ្មារ។ ឆ្ងាញ់គ្រប់ពេលវេលា។"
image: images/dishes/bobor-sach-mun.jpg
imageFamily: bobor-sach-mun
tags: [signature, porridge, chicken, breakfast, comfort-food]
dietary: [dairy-free, gluten-free]
spiceLevel: 0
difficulty: easy
servings: 6
time: { prepMinutes: 15, cookMinutes: 75, totalMinutes: 90 }
kroeung: [ginger, garlic]
equipment:   [large pot, fine sieve]
equipmentKm: [ឆ្នាំងធំ, ច្រោះល្អិត]
ingredients:
  - { group: main,      item: whole chicken,         itemKm: សាច់មាន់ទាំងមូល,  quantity: 1,    unit: kg,     notes: "free-range if possible",       notesKm: "មាន់ភូមិបើមាន" }
  - { group: main,      item: jasmine rice,          itemKm: អង្ករម្លិះ,         quantity: 1,    unit: cup,    notes: "rinsed",                       notesKm: "លាង" }
  - { group: main,      item: water,                 itemKm: ទឹក,                quantity: 3,    unit: litres }
  - { group: kroeung,   item: ginger,                itemKm: ខ្ញី,                quantity: 1,    unit: thumb,  notes: "peeled and sliced",            notesKm: "ចេញសំបក និងហាន់" }
  - { group: kroeung,   item: garlic,                itemKm: ខ្ទឹមស,             quantity: 6,    unit: cloves, notes: "for the oil",                  notesKm: "សម្រាប់ប្រេង" }
  - { group: kroeung,   item: shallots,              itemKm: ខ្ទឹមក្រហម,         quantity: 2,    unit: whole,  notes: smashed,                        notesKm: បុក }
  - { group: seasoning, item: rock sugar,            itemKm: ស្ករអំពៅ,           quantity: 1,    unit: tsp }
  - { group: seasoning, item: fish sauce,            itemKm: ទឹកត្រី,            quantity: 3,    unit: tbsp,   notes: "to taste",                     notesKm: "តាមរសជាតិ" }
  - { group: seasoning, item: salt,                  itemKm: អំបិល,             quantity: 1,    unit: tsp }
  - { group: seasoning, item: vegetable oil,         itemKm: ប្រេងបន្លែ,         quantity: 3,    unit: tbsp,   notes: "for fried garlic oil",          notesKm: "សម្រាប់ប្រេងខ្ទឹមចៀន" }
  - { group: garnish,   item: spring onion,          itemKm: ស្លឹកខ្ទឹមបារាំង,  quantity: 3,    unit: stalks, notes: sliced,                         notesKm: ហាន់ }
  - { group: garnish,   item: coriander,             itemKm: វ៉ាន់សុយ,           quantity: 1,    unit: handful, notes: "chopped",                     notesKm: "កាត់" }
  - { group: garnish,   item: white pepper,          itemKm: ម្រេចស,            quantity: 1,    unit: tsp,    notes: "to serve at the table",       notesKm: "សម្រាប់បរិភោគនៅតុបាយ" }
  - { group: garnish,   item: lime wedges,           itemKm: ក្រូចឆ្មារ,        quantity: 2,    unit: whole,  notes: "for squeezing",                notesKm: "សម្រាប់ច្របាច់" }
  - { group: serving,   item: pickled vegetables,    itemKm: បន្លែជ្រក់,         quantity: 1,    unit: bowl,   notes: "optional, on the side",        notesKm: "ស្ម័គ្រ ដាក់ខាង" }
instructions:
  - { step: 1, text: "Bring the water, sliced ginger and smashed shallots to a boil. Add the whole chicken, return to a gentle simmer.",                               textKm: "ដាំទឹក ខ្ញីហាន់ និងខ្ទឹមក្រហមបុក។ បន្ថែមមាន់ទាំងមូល ហើយដាំស្រាលៗ។" }
  - { step: 2, text: "Skim the foam carefully — a clear stock is essential.",                                                                                            textKm: "ច្រោះពពោះដោយប្រុងប្រយ័ត្ន — ទឹកស៊ុបស្អាតគឺសំខាន់។" }
  - { step: 3, text: "Simmer 30 minutes, then lift the chicken out. Cool, shred the meat, and reserve the bones to return to the stock.",                                textKm: "ដាំ ៣០ នាទី រួចលើកមាន់ចេញ។ ត្រជាក់ ហាន់សាច់ និងទុកឆ្អឹងដើម្បីដាក់ចូលទឹកស៊ុបវិញ។" }
  - { step: 4, text: "Add the rinsed rice and the chicken bones to the pot. Season with rock sugar, fish sauce and salt.",                                              textKm: "បន្ថែមអង្ករលាងស្អាត និងឆ្អឹងមាន់ចូលឆ្នាំង។ ប្រឡាក់ដោយស្ករអំពៅ ទឹកត្រី និងអំបិល។" }
  - { step: 5, text: "Simmer uncovered 40–50 minutes, stirring occasionally, until the rice breaks down and the porridge is silky.",                                    textKm: "ដាំបើករហូត ៤០–៥០ នាទី កូររាប់ៗ រហូតបាយបែក និងបបររលោង។",
      tip: "Stir from the bottom often — the rice loves to stick.",                                                                                                       tipKm: "កូរពីបាតញឹកៗ — បាយចូលចិត្តជាប់បាត។" }
  - { step: 6, text: "Make the fried garlic oil: heat the oil and fry the minced garlic gently until pale gold. Reserve.",                                              textKm: "ធ្វើប្រេងខ្ទឹមចៀន៖ កម្ដៅប្រេង ហើយចៀនខ្ទឹមសកិនថ្នមៗរហូតមានពណ៌មាស។ ទុកសល់។" }
  - { step: 7, text: "Fish out the bones from the porridge. Add the shredded chicken back in and warm through.",                                                        textKm: "យកឆ្អឹងចេញពីបបរ។ បន្ថែមសាច់មាន់ហាន់ចូលវិញ ហើយកម្ដៅឱ្យក្ដៅ។" }
  - { step: 8, text: "Ladle into bowls. Top with fried garlic oil, spring onion, coriander, white pepper and lime at the table.",                                       textKm: "ស្នូរចូលចាន។ ដាក់ប្រេងខ្ទឹមចៀន ស្លឹកខ្ទឹមបារាំង វ៉ាន់សុយ ម្រេចស និងក្រូចឆ្មារនៅតុបាយ។" }
