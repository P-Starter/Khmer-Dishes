instructions:
- step: 1
  text: Fry the red kroeung in coconut cream until the oil splits and it is fragrant.
  textKm: ឆាគ្រឿងក្រហមជាមួយខ្ទិះដូង រហូតទាល់តែប្រេងបែក ហើយឈ្ងុយ។
- step: 2
  text: Add the ground pork and cook until browned.
  textKm: ដាក់សាច់ជ្រូកកិន ហើយឆារហូតទាល់តែលឿង។
- step: 3
  text: Stir in the strained prahok and the rest of the coconut milk; simmer to a thick dip.
  textKm: ដាក់ប្រហុកដែលច្រោះរួច និងទឹកដូងដែលនៅសល់។ ដាំឱ្យក្រាស់ជាទឹកជ្រលក់។
- step: 4
  text: Add diced eggplant and palm sugar; simmer until thick and glossy.
  textKm: ដាក់ត្រប់ហាន់ និងស្ករត្នោត។ ដាំបន្តរហូតទាល់តែក្រាស់ និងភ្លឺ។
- step: 5
  text: Serve warm with a generous platter of raw and blanched vegetables and rice.
  textKm: បរិភោគក្ដៅៗ ជាមួយចានបន្លែស្រស់ បន្លែស្ងោរ និងបាយ។
