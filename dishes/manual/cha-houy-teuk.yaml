id: khm-0013
slug: cha-houy-teuk
name:
  km: ឆាហួយទឹក
  romanized: Cha Houy Teuk
  en: Grass Jelly Dessert
category: dessert
subcategory: signature
cuisine: Khmer
description: "Diced black grass jelly in palm-sugar-sweetened coconut milk with crushed ice. Cooling, lightly herbal, and gently bittersweet — the dessert that ends every hot Cambodian afternoon."
descriptionKm: "ឆាហួយទឹក — ហួយទឹកខ្មៅកាត់ជាគូប ក្នុងទឹកដូងផ្អែមដោយស្ករត្នោត និងទឹកកកបុក។ ស្រស់ មានក្លិនស្លឹក និងផ្អែមតិចៗ — បង្អែមដ៏ល្បីបន្ទាប់ពីម៉ោងថ្ងៃក្ដៅៗរបស់ខ្មែរ។"
image: images/dishes/cha-houy-teuk.jpg
imageFamily: cha-houy-teuk
tags: [signature, dessert, drink, summer, grass-jelly]
dietary: [vegetarian, vegan, dairy-free, gluten-free]
spiceLevel: 0
difficulty: easy
servings: 4
time: { prepMinutes: 10, cookMinutes: 5, totalMinutes: 15 }
kroeung: []
equipment:   [small saucepan, 4 tall glasses or bowls]
equipmentKm: [ឆ្នាំងតូច, កែវវែង ៤ ឬ ចានតូច ៤]
ingredients:
  - { group: main,      item: black grass jelly,    itemKm: ហួយទឹកខ្មៅ,         quantity: 400, unit: g,    notes: "store-bought, cut into 1.5 cm cubes", notesKm: "ទិញតាមហាង កាត់ជាគូប ១.៥សម" }
  - { group: main,      item: coconut milk,         itemKm: ទឹកដូង,             quantity: 400, unit: ml,    notes: "good quality, full-fat",              notesKm: "គុណភាពល្អ ខ្លាញ់ច្រើន" }
  - { group: main,      item: water,                itemKm: ទឹក,                quantity: 200, unit: ml }
  - { group: seasoning, item: palm sugar,           itemKm: ស្ករត្នោត,          quantity: 6,   unit: tbsp,   notes: "or to taste",                         notesKm: "តាមរសជាតិ" }
  - { group: seasoning, item: salt,                 itemKm: អំបិល,              quantity: 1,   unit: pinch }
  - { group: seasoning, item: pandan leaves,        itemKm: ស្លឹកតើយ,           quantity: 2,   unit: leaves, notes: "knotted",                             notesKm: "ចំរូង" }
  - { group: garnish,   item: crushed ice,          itemKm: ទឹកកកបុក,           quantity: 2,   unit: cups }
  - { group: garnish,   item: toasted sesame seeds, itemKm: ល្ងលីង,             quantity: 1,   unit: tbsp,   notes: "optional",                            notesKm: "ស្ម័គ្រ" }
instructions:
  - { step: 1, text: "Warm the water, palm sugar, salt and pandan in a small pan until the sugar fully dissolves. Do not boil hard.",     textKm: "កម្ដៅទឹក ស្ករត្នោត អំបិល និងស្លឹកតើយក្នុងឆ្នាំងតូចរហូតស្កររលាយទាំងស្រុង។ កុំដាំខ្លាំង។" }
  - { step: 2, text: "Take off the heat and let cool 5 minutes. Stir in the coconut milk.",                                               textKm: "ដកចេញពីភ្លើង ត្រជាក់ ៥ នាទី។ កូរទឹកដូងចូល។",
      tip: "Boiling the coconut milk will split it — gentle warmth only.",                                                                tipKm: "ដាំទឹកដូងខ្លាំងនឹងធ្វើឱ្យបែក — ត្រូវកម្ដៅស្រាលៗតែប៉ុណ្ណោះ។" }
  - { step: 3, text: "Pull out the pandan and chill the coconut syrup until cold.",                                                       textKm: "យកស្លឹកតើយចេញ ហើយត្រជាក់ទឹកដូងរហូតត្រជាក់។" }
  - { step: 4, text: "Divide the grass jelly cubes between glasses.",                                                                      textKm: "ចែកហួយទឹកចូលកែវនីមួយៗ។" }
  - { step: 5, text: "Pile a generous scoop of crushed ice on top.",                                                                       textKm: "ដាក់ទឹកកកបុកមួយក្ដាប់ធំនៅខាងលើ។" }
  - { step: 6, text: "Pour over the cold sweet coconut milk. Scatter sesame if using and serve at once with a long spoon.",                textKm: "ស្នូរទឹកដូងផ្អែមត្រជាក់ពីលើ។ រោយល្ងបើប្រើ ហើយបរិភោគភ្លាមៗដោយស្លាបព្រាវែង។" }
