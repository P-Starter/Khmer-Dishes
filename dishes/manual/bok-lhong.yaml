id: khm-0006
slug: bok-lhong
name:
  km: បុកល្ហុង
  romanized: Bok L'hong
  en: Khmer Green Papaya Salad
category: salad
subcategory: signature
cuisine: Khmer
description: "Cambodia's everyday street salad — pounded green papaya with prahok, lime, palm sugar and chili. Distinct from the Thai version by its mandatory prahok and a deeper, salty-funky backbone."
descriptionKm: "បុកល្ហុង — ល្ហុងខ្ចីបុកជាមួយប្រហុក ទឹកក្រូចឆ្មារ ស្ករត្នោត និងម្ទេស។ ម្ហូបសាឡាត់ផ្លូវដ៏ល្បីរបស់ខ្មែរ ខុសពីស្ទីលថៃដោយរសប្រហុកដ៏ឈ្ងុយជ្រៅ។"
image: images/dishes/bok-lhong.jpg
imageFamily: bok-lhong
tags: [signature, salad, papaya, prahok, street-food]
dietary: [pescatarian, gluten-free, dairy-free]
spiceLevel: 3
difficulty: easy
servings: 4
time: { prepMinutes: 20, cookMinutes: 0, totalMinutes: 20 }
kroeung: []
equipment:   [large mortar and pestle, shredder]
equipmentKm: [អង្គ្រែធំ, ឧបករណ៍ចិត]
ingredients:
  - { group: main,      item: green papaya,         itemKm: ល្ហុងខ្ចី,        quantity: 1, unit: medium, notes: "peeled and shredded", notesKm: "ចេញសំបក ហើយចិត" }
  - { group: main,      item: cherry tomatoes,      itemKm: ប៉េងប៉ោះតូច,     quantity: 8, unit: whole,  notes: halved,                notesKm: កាត់ពាក់កណ្ដាល }
  - { group: main,      item: yardlong beans,       itemKm: សណ្ដែកគួរ,        quantity: 4, unit: whole,  notes: "cut in 4 cm lengths", notesKm: "កាត់ ៤សម" }
  - { group: kroeung,   item: garlic,               itemKm: ខ្ទឹមស,            quantity: 3, unit: cloves }
  - { group: kroeung,   item: bird's-eye chili,     itemKm: ម្ទេសខ្មាំង,        quantity: 4, unit: whole,  notes: "or to taste",        notesKm: "តាមរសជាតិ" }
  - { group: seasoning, item: prahok,               itemKm: ប្រហុក,             quantity: 1, unit: tbsp,   notes: "mashed and strained", notesKm: "បុក និងច្រោះ" }
  - { group: seasoning, item: lime juice,           itemKm: ទឹកក្រូចឆ្មារ,    quantity: 3, unit: tbsp }
  - { group: seasoning, item: palm sugar,           itemKm: ស្ករត្នោត,         quantity: 2, unit: tsp }
  - { group: seasoning, item: fish sauce,           itemKm: ទឹកត្រី,           quantity: 1, unit: tbsp }
  - { group: garnish,   item: dried shrimp,         itemKm: បង្គាស្ងួត,        quantity: 2, unit: tbsp,   notes: "lightly toasted",     notesKm: "លីងបន្តិច" }
  - { group: garnish,   item: roasted peanuts,      itemKm: សណ្ដែកដីលីង,      quantity: 2, unit: tbsp,   notes: crushed,               notesKm: បុក }
instructions:
  - { step: 1, text: "Pound the garlic and chili in a large mortar to a rough paste.",                                           textKm: "បុកខ្ទឹមស និងម្ទេសក្នុងអង្គ្រែធំជាគ្រឿងបុកសុះៗ។" }
  - { step: 2, text: "Add the prahok, lime juice, palm sugar and fish sauce; pound briefly to combine.",                          textKm: "បន្ថែមប្រហុក ទឹកក្រូចឆ្មារ ស្ករត្នោត និងទឹកត្រី; បុកបន្តិចឱ្យលាយ។" }
  - { step: 3, text: "Add the yardlong beans and pound just to bruise.",                                                          textKm: "បន្ថែមសណ្ដែកគួរ ហើយបុកថ្នមៗឱ្យបែក។" }
  - { step: 4, text: "Add the tomatoes and pound lightly to release the juices.",                                                 textKm: "បន្ថែមប៉េងប៉ោះ ហើយបុកស្រាលៗឱ្យបែកទឹក។" }
  - { step: 5, text: "Add the shredded green papaya. Toss and gently bruise with the pestle and a large spoon.",                  textKm: "បន្ថែមល្ហុងខ្ចីចិត។ លាយ និងបុកថ្នមៗដោយអង្គ្រែ និងស្លាបព្រាធំ។",
      tip:   "Bruising rather than hammering keeps the papaya crisp.",                                                            tipKm:  "បុកថ្នមៗជាជាងបុកខ្លាំង ដើម្បីឱ្យល្ហុងនៅក្រៀម។" }
  - { step: 6, text: "Taste and adjust — it should ring salty, sour, sweet and very spicy.",                                       textKm: "ភ្លក់ ហើយកែតម្រូវ — រសជាតិគួរតែប្រៃ ជូរ ផ្អែម និងហឹរខ្លាំង។" }
  - { step: 7, text: "Pile onto a plate and top with dried shrimp and roasted peanuts.",                                          textKm: "ដាក់លើចាន ហើយរោយបង្គាស្ងួត និងសណ្ដែកដីលីងពីលើ។" }
